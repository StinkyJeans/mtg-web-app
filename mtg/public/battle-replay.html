<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Battle replay</title>
<style>
  :root { color-scheme: dark; --card-w: 112px; --card-h: 156px; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; background: #050816; color: #e2e8f0; font-family: system-ui, "Segoe UI", sans-serif; display: grid; grid-template-columns: 1fr 300px; grid-template-rows: auto 1fr auto; gap: 8px; padding: 8px; overflow: hidden; }
  header { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 15px; font-weight: 700; }
  .meta { font-size: 12px; color: #94a3b8; }
  button, select { font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.1); color: #fff; cursor: pointer; }
  button:hover { background: rgba(255,255,255,.2); }
  button.primary { background: #f59e0b; color: #000; border-color: #fbbf24; font-weight: 700; }
  .arena { position: relative; border-radius: 16px; border: 1px solid rgba(255,255,255,.15); background: radial-gradient(ellipse at 50% 50%, #1b2a4a 0%, #0b1226 62%, #050816 100%); display: flex; flex-direction: column; overflow: hidden; min-height: 0; }
  .side { flex: 1; display: flex; flex-direction: column; gap: 4px; padding: 8px 12px; min-height: 0; }
  .side.top { border-bottom: 1px dashed rgba(255,255,255,.15); }
  .bar { display: flex; align-items: center; gap: 12px; font-size: 13px; }
  .bar .who { font-weight: 800; letter-spacing: .04em; }
  .life { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; min-width: 40px; }
  .hp { width: 200px; height: 8px; border-radius: 9px; background: rgba(255,255,255,.12); overflow: hidden; }
  .hp i { display: block; height: 100%; background: linear-gradient(90deg,#22c55e,#4ade80); transition: width .5s ease, background .5s; }
  .small { color: #94a3b8; font-size: 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; min-height: calc(var(--card-h) + 10px); padding: 4px 2px; }
  .lands { display: flex; gap: 6px; flex-wrap: wrap; min-height: 22px; }
  .land { font-size: 11px; padding: 2px 8px; border-radius: 6px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15); }
  .land.t { opacity: .45; }
  .card { position: relative; width: var(--card-w); height: var(--card-h); border-radius: 9px; border: 2px solid #0b0f1a; padding: 6px; font-size: 10px; line-height: 1.2; overflow: hidden; box-shadow: 0 4px 12px rgba(0,0,0,.6); background: linear-gradient(160deg,#334155,#0f172a); transition: transform .35s ease, opacity .5s; will-change: transform; }
  .card .n { font-weight: 800; font-size: 11px; text-shadow: 0 1px 2px #000; }
  .card .tl { color: #cbd5e1; font-size: 9px; margin: 1px 0 3px; }
  .card .tx { color: #e2e8f0; font-size: 8.5px; opacity: .9; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
  .card .pt { position: absolute; right: 4px; bottom: 4px; padding: 2px 7px; border-radius: 7px; background: #0b0f1a; border: 1px solid rgba(255,255,255,.4); font-weight: 800; font-size: 13px; }
  .card .pt.hurt { color: #fca5a5; border-color: #ef4444; }
  .card .dmg { position: absolute; left: 4px; bottom: 4px; font-size: 10px; font-weight: 800; color: #fecaca; }
  .card.tapped { transform: rotate(90deg); margin: 0 22px; opacity: .85; }
  .card.sick::after { content: "zz"; position: absolute; left: 4px; top: 2px; font-size: 9px; opacity: .6; }
  .fx { position: absolute; pointer-events: none; will-change: transform, opacity; z-index: 20; }
  .flash { inset: 0; opacity: 0; }
  .ring { width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; border: 3px solid #fde68a; box-shadow: 0 0 18px #f59e0b, inset 0 0 12px #f59e0b; }
  .spark { width: 5px; height: 5px; margin: -2px; border-radius: 50%; background: #fde68a; box-shadow: 0 0 8px 2px #f59e0b; }
  .num { font-size: 36px; font-weight: 900; color: #fff; text-shadow: 0 0 10px #ef4444, 0 3px 0 #7f1d1d, 0 0 2px #000; }
  .num.heal { text-shadow: 0 0 10px #22c55e, 0 3px 0 #14532d; }
  .banner { position: absolute; left: 0; right: 0; top: 47%; text-align: center; font-size: 15px; letter-spacing: .5em; text-transform: uppercase; font-weight: 800; color: #fde68a; opacity: 0; text-shadow: 0 0 14px #f59e0b; pointer-events: none; z-index: 15; }
  aside { display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  .panel { border-radius: 12px; border: 1px solid rgba(255,255,255,.15); background: rgba(15,23,42,.7); padding: 10px; font-size: 12px; min-height: 0; }
  .panel h2 { margin: 0 0 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #94a3b8; }
  #read { min-height: 120px; } #read b { color: #fde68a; } #read .why { color: #86efac; }
  #log { flex: 1; overflow-y: auto; } #log div { padding: 3px 0; border-bottom: 1px solid rgba(255,255,255,.06); } #log .p1 { color: #7dd3fc; } #log .p2 { color: #fda4af; } #log .big { font-weight: 700; color: #fde68a; }
  footer { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  #cap { font-size: 14px; flex: 1; min-width: 240px; }
  input[type=range] { width: 200px; }
  .over { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; background: rgba(5,8,22,.75); z-index: 30; font-size: 34px; font-weight: 900; gap: 8px; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>Battle replay</h1>
  <span class="meta" id="meta"></span>
  <button class="primary" id="play">Pause</button>
  <button id="back">◀ Step</button>
  <button id="fwd">Step ▶</button>
  <button id="restart">Restart</button>
  <label class="meta">Speed <select id="speed"><option value="2">Slow</option><option value="1" selected>Normal</option><option value="0.5">Fast</option><option value="0.2">Very fast</option></select></label>
  <label class="meta"><input type="checkbox" id="skip" checked> skip quiet moves</label>
</header>
<div class="arena" id="arena">
  <div class="side top" id="top"></div>
  <div class="side" id="bottom"></div>
  <div class="banner" id="banner"></div>
  <div class="over" id="over"></div>
</div>
<aside>
  <div class="panel" id="read"><h2>The bot reads</h2><div id="readText" class="small">…</div></div>
  <div class="panel" id="log"><h2>What happened</h2></div>
</aside>
<footer>
  <div id="cap"></div>
  <input type="range" id="seek" min="0" value="0">
</footer>

const steps = DATA.steps, cards = DATA.cards;
const arena = document.getElementById("arena");
const NAME = { p1: "Player 1", p2: "Player 2" };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms * speedF()));
const speedF = () => Number(document.getElementById("speed").value);
const nameOfIid = (() => { const m = {}; for (const s of steps) for (const id of ["p1", "p2"]) for (const p of s.after.players[id].board) m[p.iid] = p; return (iid) => m[iid]; })();
const ownerOfIid = (iid) => (iid.startsWith("p2") ? "p2" : "p1");
document.getElementById("meta").textContent = `seed ${DATA.seed} · ${DATA.turns} turns · winner ${NAME[DATA.winner]} · ${steps.length} moves`;
const seek = document.getElementById("seek"); seek.max = steps.length - 1;

function render(snap) {
  for (const id of ["p1", "p2"]) {
    const pl = snap.players[id], el = document.getElementById(id === "p2" ? "top" : "bottom");
    const lands = {}; for (const p of pl.board) if (p.type === "land") { const k = p.name + (p.tapped ? " (tapped)" : ""); lands[k] = (lands[k] || 0) + 1; }
    const perms = pl.board.filter((p) => p.type !== "land");
    const pct = Math.max(0, Math.min(100, pl.life * 5));
    el.innerHTML = `
      <div class="bar"><span class="who" style="color:${id === "p1" ? "#7dd3fc" : "#fda4af"}">${NAME[id]}${snap.active === id ? " ★" : ""}</span>
        <span class="life" data-life="${id}">${pl.life}</span><div class="hp"><i style="width:${pct}%;${pl.life <= 7 ? "background:linear-gradient(90deg,#ef4444,#f97316)" : ""}"></i></div>
        <span class="small">hand ${pl.hand} · library ${pl.library} · graveyard ${pl.graveyard.length}</span></div>
      <div class="lands">${Object.entries(lands).map(([k, v]) => `<span class="land ${k.includes("tapped") ? "t" : ""}">${k.replace(" (tapped)", "")} ×${v}</span>`).join("")}</div>
      <div class="row">${perms.map(cardHtml).join("")}</div>`;
  }
}
function colorOf(p) { const t = (p.typeLine + " " + p.text).toLowerCase(); return ""; }
function cardHtml(p) {
  const hurt = p.damage > 0;
  const pt = p.power !== null ? `<div class="pt ${hurt ? "hurt" : ""}">${p.power}/${p.toughness}</div>` : "";
  return `<div class="card ${p.tapped ? "tapped" : ""} ${p.sick ? "sick" : ""}" data-iid="${p.iid}" title="${(p.name + "\n" + p.typeLine + "\n" + p.text).replace(/"/g, "'")}">
    <div class="n">${p.name}</div><div class="tl">${p.typeLine.replace(/Legendary /, "")}</div><div class="tx">${p.text.replace(/\n/g, " · ")}</div>${pt}${hurt ? `<div class="dmg">−${p.damage}</div>` : ""}</div>`;
}
const cardEl = (iid) => document.querySelector(`[data-iid="${iid}"]`);
const centerIn = (el) => { const a = arena.getBoundingClientRect(), r = el.getBoundingClientRect(); return { x: r.left - a.left + r.width / 2, y: r.top - a.top + r.height / 2 }; };
const lifeEl = (id) => document.querySelector(`[data-life="${id}"]`);

function fx(cls, x, y, html = "") { const e = document.createElement("div"); e.className = "fx " + cls; e.style.left = x + "px"; e.style.top = y + "px"; e.innerHTML = html; arena.appendChild(e); return e; }
function shake(p) { arena.animate([{ transform: "translate(0,0)" }, { transform: `translate(${-p}px,${p * .6}px)` }, { transform: `translate(${p}px,${-p * .5}px)` }, { transform: `translate(${-p * .5}px,${p * .3}px)` }, { transform: "translate(0,0)" }], { duration: 320, easing: "ease-out" }); }
function impact(x, y, big = 1) {
  const f = fx("flash", 0, 0); f.style.background = `radial-gradient(circle at ${x}px ${y}px, #fff 0%, rgba(255,220,150,.55) 16%, transparent 50%)`; f.style.left = 0; f.style.top = 0;
  f.animate([{ opacity: 0 }, { opacity: 1 }, { opacity: 0 }], { duration: 240, easing: "ease-out" }).onfinish = () => f.remove();
  for (let i = 0; i < 2; i++) { const r = fx("ring", x, y); r.animate([{ transform: "scale(.4)", opacity: .95 }, { transform: `scale(${(4.5 + i * 2.5) * big})`, opacity: 0 }], { duration: 500 + i * 160, delay: i * 80, easing: "ease-out", fill: "backwards" }).onfinish = () => r.remove(); }
  for (let i = 0; i < 18; i++) { const a = Math.random() * 6.283, d = (45 + Math.random() * 100) * big, s = fx("spark", x, y); s.animate([{ transform: "translate(0,0) scale(1)", opacity: 1 }, { transform: `translate(${Math.cos(a) * d}px,${Math.sin(a) * d + 24}px) scale(.2)`, opacity: 0 }], { duration: 420 + Math.random() * 330, easing: "cubic-bezier(.1,.7,.3,1)" }).onfinish = () => s.remove(); }
  shake(9 * big);
}
function number(x, y, n, heal) { const e = fx("num" + (heal ? " heal" : ""), x, y, (heal ? "+" : "−") + n); e.animate([{ transform: "translate(-50%,-30%) scale(.4)", opacity: 0 }, { transform: "translate(-50%,-80%) scale(1.4)", opacity: 1, offset: .25 }, { transform: "translate(-50%,-110%) scale(1)", opacity: 1, offset: .7 }, { transform: "translate(-50%,-190%) scale(.9)", opacity: 0 }], { duration: 1100, easing: "ease-out" }).onfinish = () => e.remove(); }
function banner(t) { const b = document.getElementById("banner"); b.textContent = t; b.animate([{ opacity: 0, letterSpacing: ".9em" }, { opacity: 1, letterSpacing: ".5em", offset: .3 }, { opacity: 1, offset: .7 }, { opacity: 0, letterSpacing: ".35em" }], { duration: 1000 * speedF() }); }

const nm = (iid) => nameOfIid(iid)?.name ?? iid;
function describe(step) {
  const who = NAME[step.who]; const out = [];
  for (const t of step.thoughts) out.push(t);
  for (const e of step.events) {
    if (e.type === "combatDamage") out.push(`${nm(e.source)} hits ${e.target === "p1" || e.target === "p2" ? NAME[e.target] : nm(e.target)} for ${e.amount}`);
    if (e.type === "creatureDied") out.push(`${nm(e.iid)} dies`);
    if (e.type === "effect") out.push(e.text);
    if (e.type === "countered") out.push(`${e.name} is countered`);
    if (e.type === "lifeGained") out.push(`${NAME[e.player]} gains ${e.amount} life`);
    if (e.type === "lifeLost") out.push(`${NAME[e.player]} loses ${e.amount} life`);
    if (e.type === "turnStarted") out.push(`Turn ${e.turn}: ${NAME[e.player]}`);
    if (e.type === "gameWon") out.push(`${NAME[e.player]} wins!`);
  }
  return { who, lines: out };
}
function readCard(step) {
  const names = [];
  for (const t of step.thoughts) { const m = t.match(/^casts (.+?) \((.*)\)$/); if (m) names.push({ name: m[1], why: m[2] }); }
  if (!names.length) return null;
  const html = names.map((n) => { const c = Object.values(cards).find((x) => x.name === n.name); return `<div><b>${n.name}</b> <span class="small">${c ? c.typeLine : ""}</span><br>${c ? c.text.replace(/\n/g, "<br>") : ""}<div class="why">→ plays it because: ${n.why}</div></div>`; }).join("<hr>");
  return html;
}
const logEl = document.getElementById("log");
function addLog(who, text, big) { const d = document.createElement("div"); d.className = (who || "") + (big ? " big" : ""); d.textContent = text; logEl.appendChild(d); logEl.scrollTop = logEl.scrollHeight; }

const QUIET = new Set(["passPhase", "passPriority", "keepHand", "discard"]);
const loud = (s) => s.thoughts.length > 0 || s.events.some((e) => ["combatDamage", "creatureDied", "spellCast", "creatureCast", "lifeGained", "lifeLost", "gameWon", "effect", "countered", "turnStarted"].includes(e.type));

let idx = 0, playing = true, token = 0;
async function show(i, animate) {
  const my = ++token; idx = i; seek.value = i;
  const step = steps[i], prev = steps[Math.max(0, i - 1)];
  render(prev.after);
  const d = describe(step);
  document.getElementById("cap").innerHTML = `<b style="color:${step.who === "p1" ? "#7dd3fc" : "#fda4af"}">${d.who}</b> · turn ${step.after.turn} · ${step.after.phase} — ${d.lines.join(" · ") || step.did}`;
  const rd = readCard(step); if (rd) document.getElementById("readText").innerHTML = rd;
  for (const l of d.lines) addLog(step.who, l, /wins|dies|hits/.test(l));
  if (animate && step.events.some((e) => e.type === "attackersDeclared")) banner("Attack");
  if (animate && step.events.some((e) => e.type === "blockersDeclared" && e.blocks.length)) banner("Block");
  if (animate) {
    for (const e of step.events) {
      if (my !== token) return;
      if (e.type === "combatDamage") {
        const src = cardEl(e.source); const isP = e.target === "p1" || e.target === "p2";
        const tgt = isP ? lifeEl(e.target) : cardEl(e.target);
        if (src && tgt) {
          const a = centerIn(src), b = centerIn(tgt);
          await src.animate([{ transform: src.classList.contains("tapped") ? "rotate(90deg)" : "none" }, { transform: `translate(${(b.x - a.x) * .8}px,${(b.y - a.y) * .8}px) scale(1.25) ${src.classList.contains("tapped") ? "rotate(90deg)" : ""}` }], { duration: 300 * speedF(), easing: "cubic-bezier(.6,0,1,.6)", fill: "forwards" }).finished;
          impact(b.x, b.y, e.amount >= 4 ? 1.3 : 1); number(b.x, b.y - 10, e.amount);
          src.animate([{ filter: "brightness(2.5)" }, { filter: "none" }], { duration: 250 });
          await sleep(380);
        }
      }
      if (e.type === "lifeGained") { const t = lifeEl(e.player); if (t) { const b = centerIn(t); number(b.x, b.y, e.amount, true); } }
      if (e.type === "creatureDied") { const el = cardEl(e.iid); if (el) { el.animate([{ opacity: 1, filter: "brightness(1)" }, { opacity: 1, filter: "brightness(2.4)", offset: .3 }, { opacity: 0, transform: "translateY(18px) scale(.85)" }], { duration: 600 * speedF(), fill: "forwards" }); await sleep(560); } }
    }
  }
  if (my !== token) return;
  render(step.after);
  if (animate && step.events.some((e) => e.type === "creatureCast" || e.type === "permanentEntered")) {
    for (const e of step.events) if (e.type === "permanentEntered") { const el = cardEl(e.iid); if (el) el.animate([{ transform: "scale(.5)", opacity: 0, filter: "brightness(2.2)" }, { transform: "scale(1)", opacity: 1, filter: "brightness(1)" }], { duration: 420 * speedF(), easing: "cubic-bezier(.2,.8,.2,1)" }); }
  }
  if (i === steps.length - 1) { const o = document.getElementById("over"); o.style.display = "flex"; o.innerHTML = `${NAME[DATA.winner]} wins<div class="small" style="font-size:14px;font-weight:600">after ${DATA.turns} turns</div>`; }
}
async function run() {
  while (true) {
    if (playing && idx < steps.length - 1) {
      const next = idx + 1, s = steps[next];
      const isLoud = loud(s);
      if (!isLoud && document.getElementById("skip").checked) { await show(next, false); await sleep(45); }
      else { await show(next, true); await sleep(isLoud ? 650 : 200); }
    } else await new Promise((r) => setTimeout(r, 120));
  }
}
document.getElementById("play").onclick = (e) => { playing = !playing; e.target.textContent = playing ? "Pause" : "Play"; };
document.getElementById("fwd").onclick = () => { playing = false; document.getElementById("play").textContent = "Play"; if (idx < steps.length - 1) show(idx + 1, true); };
document.getElementById("back").onclick = () => { playing = false; document.getElementById("play").textContent = "Play"; if (idx > 0) show(idx - 1, false); };
document.getElementById("restart").onclick = () => { logEl.querySelectorAll("div").forEach((d) => d.remove()); document.getElementById("over").style.display = "none"; show(0, false); playing = true; document.getElementById("play").textContent = "Pause"; };
seek.oninput = () => { playing = false; document.getElementById("play").textContent = "Play"; document.getElementById("over").style.display = "none"; show(Number(seek.value), false); };
show(0, false); run();
</script>
</body>
</html>
