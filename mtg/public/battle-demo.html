<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Battle animation demo</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: #050816; color: #e2e8f0; font-family: system-ui, "Segoe UI", sans-serif; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 18px 12px; }
  h1 { font-size: 18px; margin: 0; font-weight: 700; letter-spacing: .02em; }
  p.note { margin: 0; font-size: 13px; color: #94a3b8; max-width: 720px; text-align: center; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  button { font: inherit; font-size: 14px; font-weight: 600; padding: 9px 16px; border-radius: 10px; border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.1); color: #fff; cursor: pointer; }
  button:hover { background: rgba(255,255,255,.2); }
  button.primary { background: #f59e0b; color: #000; border-color: #fbbf24; }
  button:disabled { opacity: .45; cursor: default; }

  .arena { position: relative; width: min(900px, 100%); height: 520px; border-radius: 18px; overflow: hidden; border: 1px solid rgba(255,255,255,.18);
    background: radial-gradient(ellipse at 50% 50%, #1b2a4a 0%, #0b1226 60%, #050816 100%); }
  .arena::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, transparent 0 59px, rgba(255,255,255,.04) 59px 60px); }
  .shake { will-change: transform; }
  .lane { position: absolute; left: 0; right: 0; height: 1px; top: 50%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.18), transparent); }

  .hero { position: absolute; left: 50%; width: 220px; margin-left: -110px; padding: 8px 12px; border-radius: 12px; background: rgba(15,23,42,.7); border: 1px solid rgba(255,255,255,.2); display: flex; align-items: center; gap: 10px; }
  .hero.top { top: 12px; } .hero.bottom { bottom: 12px; }
  .hero b { font-size: 22px; font-variant-numeric: tabular-nums; min-width: 34px; }
  .hp { flex: 1; height: 8px; border-radius: 9px; background: rgba(255,255,255,.12); overflow: hidden; }
  .hp i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg,#22c55e,#4ade80); transform-origin: left; transition: transform .6s cubic-bezier(.2,.8,.2,1); }

  .card { position: absolute; width: 112px; height: 156px; border-radius: 10px; border: 2px solid #0b0f1a; box-shadow: 0 6px 18px rgba(0,0,0,.6); overflow: hidden; will-change: transform, opacity; }
  .card .art { position: absolute; inset: 6px 6px 56px; border-radius: 6px; }
  .card .name { position: absolute; left: 8px; right: 8px; top: 8px; font-size: 11px; font-weight: 700; text-shadow: 0 1px 2px #000; z-index: 2; }
  .card .stats { position: absolute; right: 6px; bottom: 6px; padding: 3px 9px; border-radius: 8px; background: #0b0f1a; font-weight: 800; font-size: 15px; border: 1px solid rgba(255,255,255,.35); z-index: 2; }
  .card .text { position: absolute; left: 8px; right: 8px; bottom: 36px; font-size: 9px; color: #fff; opacity: .85; }
  .atk { background: linear-gradient(160deg, #7f1d1d, #1c0a0a); } .atk .art { background: radial-gradient(circle at 50% 35%, #fb923c, #b91c1c 55%, #450a0a); }
  .def { background: linear-gradient(160deg, #1e3a8a, #0a1230); } .def .art { background: radial-gradient(circle at 50% 35%, #7dd3fc, #2563eb 55%, #0f1d4d); }
  .glow { position: absolute; inset: -6px; border-radius: 14px; opacity: 0; pointer-events: none; }

  .fx { position: absolute; pointer-events: none; will-change: transform, opacity; }
  .flash { inset: 0; background: radial-gradient(circle at var(--x) var(--y), #fff 0%, rgba(255,220,150,.55) 18%, transparent 55%); opacity: 0; }
  .ring { width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; border: 3px solid #fde68a; box-shadow: 0 0 18px #f59e0b, inset 0 0 12px #f59e0b; }
  .spark { width: 5px; height: 5px; margin: -2px; border-radius: 50%; background: #fde68a; box-shadow: 0 0 8px 2px #f59e0b; }
  .trail { width: 112px; height: 156px; margin: 0; border-radius: 10px; background: rgba(251,146,60,.35); box-shadow: 0 0 24px 6px rgba(251,146,60,.55); }
  .num { font-size: 40px; font-weight: 900; color: #fff; text-shadow: 0 0 10px #ef4444, 0 3px 0 #7f1d1d, 0 0 2px #000; transform: translate(-50%, -50%); }
  .num.heal { text-shadow: 0 0 10px #22c55e, 0 3px 0 #14532d; }
  .banner { position: absolute; left: 0; right: 0; top: 46%; text-align: center; font-size: 15px; letter-spacing: .5em; text-transform: uppercase; font-weight: 800; color: #fde68a; opacity: 0; text-shadow: 0 0 14px #f59e0b; pointer-events: none; }
</style>
</head>
<body>
  <h1>Battle animation demo</h1>
  <p class="note">My own Arena-style take (I couldn't open the Behance page). Everything uses transform + opacity only, so it stays smooth. Try each scene, then tell me what to change.</p>
  <div class="bar">
    <button class="primary" id="b1">Attack · unblocked</button>
    <button id="b2">Attack · blocked, both trade</button>
    <button id="b3">Attack · blocked, attacker wins</button>
    <button id="b4">Calm (fewer effects)</button>
  </div>
  <div class="arena shake" id="arena">
    <div class="lane"></div>
    <div class="hero top"><span>P2</span><b id="hpTopN">20</b><div class="hp"><i id="hpTop"></i></div></div>
    <div class="hero bottom"><span>P1</span><b id="hpBotN">20</b><div class="hp"><i id="hpBot"></i></div></div>
    <div class="banner" id="banner">Combat</div>
  </div>

<script>
const arena = document.getElementById("arena");
const W = () => arena.clientWidth, H = () => arena.clientHeight;
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const ease = "cubic-bezier(.2,.8,.2,1)";
let calm = false, busy = false;

function card(cls, name, text, p, t, x, y) {
  const c = document.createElement("div");
  c.className = "card " + cls;
  c.innerHTML = `<div class="art"></div><div class="name">${name}</div><div class="text">${text}</div><div class="stats">${p}/${t}</div><div class="glow"></div>`;
  c.style.left = x + "px"; c.style.top = y + "px";
  arena.appendChild(c);
  return c;
}
const fx = (cls, x, y, html = "") => { const e = document.createElement("div"); e.className = "fx " + cls; e.style.left = x + "px"; e.style.top = y + "px"; e.innerHTML = html; arena.appendChild(e); return e; };
const center = (c) => ({ x: c.offsetLeft + c.offsetWidth / 2, y: c.offsetTop + c.offsetHeight / 2 });

function shake(power) {
  if (calm) power *= 0.35;
  arena.animate([{ transform: "translate(0,0)" }, { transform: `translate(${-power}px, ${power * .6}px)` }, { transform: `translate(${power}px, ${-power * .5}px)` }, { transform: `translate(${-power * .6}px, ${power * .4}px)` }, { transform: `translate(${power * .3}px, 0)` }, { transform: "translate(0,0)" }], { duration: 340, easing: "ease-out" });
}
function impact(x, y, big = 1) {
  const f = fx("flash", 0, 0); f.style.setProperty("--x", x + "px"); f.style.setProperty("--y", y + "px"); f.style.left = 0; f.style.top = 0;
  f.animate([{ opacity: 0 }, { opacity: 1 }, { opacity: 0 }], { duration: calm ? 180 : 260, easing: "ease-out" }).onfinish = () => f.remove();
  const rings = calm ? 1 : 2;
  for (let i = 0; i < rings; i++) {
    const r = fx("ring", x, y);
    r.animate([{ transform: "scale(.4)", opacity: .95 }, { transform: `scale(${(5 + i * 2.5) * big})`, opacity: 0 }], { duration: 520 + i * 160, delay: i * 90, easing: "ease-out", fill: "backwards" }).onfinish = () => r.remove();
  }
  const n = calm ? 8 : 22;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, d = (50 + Math.random() * 110) * big;
    const s = fx("spark", x, y);
    s.animate([{ transform: "translate(0,0) scale(1)", opacity: 1 }, { transform: `translate(${Math.cos(a) * d}px, ${Math.sin(a) * d + 30}px) scale(.2)`, opacity: 0 }], { duration: 450 + Math.random() * 350, easing: "cubic-bezier(.1,.7,.3,1)" }).onfinish = () => s.remove();
  }
  shake(11 * big);
}
function damage(x, y, n, heal) {
  const e = fx("num" + (heal ? " heal" : ""), x, y, (heal ? "+" : "−") + n);
  e.animate([{ transform: "translate(-50%,-30%) scale(.4)", opacity: 0 }, { transform: "translate(-50%,-80%) scale(1.45)", opacity: 1, offset: .25 }, { transform: "translate(-50%,-110%) scale(1)", opacity: 1, offset: .7 }, { transform: "translate(-50%,-190%) scale(.9)", opacity: 0 }], { duration: 1150, easing: "ease-out" }).onfinish = () => e.remove();
}
async function lunge(c, tx, ty, ms = 360) {
  // wind up: lift and glow, then dash with a ghost trail
  const g = c.querySelector(".glow");
  g.style.boxShadow = "0 0 26px 8px rgba(251,146,60,.9)";
  g.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 260, fill: "forwards" });
  await c.animate([{ transform: "translate(0,0) scale(1)" }, { transform: "translate(0,-14px) scale(1.14) rotate(-3deg)" }], { duration: 300, easing: ease, fill: "forwards" }).finished;
  const dx = tx - center(c).x, dy = ty - center(c).y;
  if (!calm) for (let i = 1; i <= 3; i++) {
    const t = fx("trail", c.offsetLeft, c.offsetTop);
    t.animate([{ transform: "translate(0,-14px) scale(1.14)", opacity: .5 }, { transform: `translate(${dx * (1 - i * .18)}px, ${dy * (1 - i * .18)}px) scale(1.14)`, opacity: 0 }], { duration: ms + 140, delay: i * 35, easing: "ease-in", fill: "backwards" }).onfinish = () => t.remove();
  }
  await c.animate([{ transform: "translate(0,-14px) scale(1.14) rotate(-3deg)" }, { transform: `translate(${dx}px, ${dy}px) scale(1.2) rotate(2deg)` }], { duration: ms, easing: "cubic-bezier(.6,0,1,.6)", fill: "forwards" }).finished;
}
async function returnHome(c) {
  const g = c.querySelector(".glow");
  g.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 400, fill: "forwards" });
  await c.animate([{ transform: c.getAnimations().length ? getComputedStyle(c).transform : "none" }, { transform: "translate(0,0) scale(1)" }], { duration: 480, easing: ease, fill: "forwards" }).finished;
}
function hit(c, power = 1) {
  return c.animate([{ filter: "brightness(1)" }, { filter: "brightness(3)" }, { filter: "brightness(1)" }], { duration: 220 }).finished;
}
async function die(c) {
  const { x, y } = center(c);
  const base = getComputedStyle(c).transform; // where the dash left the card
  const a = c.animate([{ opacity: 1, transform: base, filter: "brightness(1)" }, { opacity: 1, transform: `${base} scale(1.06)`, filter: "brightness(2.6)", offset: .25 }, { opacity: 0, transform: `${base} translateY(24px) scale(.82) rotate(6deg)`, filter: "brightness(1)" }], { duration: 650, easing: "ease-in", fill: "forwards" });
  if (!calm) for (let i = 0; i < 16; i++) { const s = fx("spark", x + (Math.random() - .5) * 90, y + (Math.random() - .5) * 120); s.animate([{ transform: "translate(0,0)", opacity: 1 }, { transform: `translate(${(Math.random() - .5) * 60}px, ${-60 - Math.random() * 110}px) scale(.3)`, opacity: 0 }], { duration: 800 + Math.random() * 500, delay: 150 + Math.random() * 200, easing: "ease-out", fill: "backwards" }).onfinish = () => s.remove(); }
  await a.finished; c.remove();
}
function banner(text) {
  const b = document.getElementById("banner"); b.textContent = text;
  b.animate([{ opacity: 0, letterSpacing: ".9em" }, { opacity: 1, letterSpacing: ".5em", offset: .3 }, { opacity: 1, offset: .7 }, { opacity: 0, letterSpacing: ".35em" }], { duration: 1100 });
}
function setHp(top, n) { const k = top ? "hpTop" : "hpBot"; document.getElementById(k + "N").textContent = n; document.getElementById(k).style.transform = `scaleX(${Math.max(0, n) / 20})`; }

async function scene(kind) {
  if (busy) return; busy = true; document.querySelectorAll("button").forEach((b) => (b.disabled = true));
  arena.querySelectorAll(".card, .fx").forEach((e) => e.remove()); setHp(true, 20); setHp(false, 20);
  const w = W(), h = H();
  const atk = card("atk", "Ember Drake", "Flying. Fierce.", kind === "wins" ? 5 : 4, kind === "wins" ? 5 : 4, w / 2 - 56, h - 200);
  await sleep(200); banner("Attack");
  if (kind === "open") {
    const tx = w / 2, ty = 80;
    await lunge(atk, tx, ty);
    impact(tx, ty + 40, 1.1); hit(atk); damage(tx, ty + 30, 4); setHp(true, 16);
    await sleep(500); await returnHome(atk);
  } else {
    const blk = card("def", "Tide Warden", "Defender.", 4, kind === "wins" ? 2 : 4, w / 2 - 56, 70);
    blk.animate([{ opacity: 0, transform: "translateY(-30px) scale(.9)" }, { opacity: 1, transform: "none" }], { duration: 400, easing: ease });
    await sleep(500); banner("Block");
    const b = center(blk);
    await lunge(atk, b.x, b.y + 70);
    const mx = b.x, my = b.y + 56;
    impact(mx, my, 1.35); hit(atk); hit(blk);
    // blocker recoils
    blk.animate([{ transform: "translate(0,0)" }, { transform: "translate(0,-26px) rotate(-5deg)" }, { transform: "translate(0,0)" }], { duration: 380, easing: "ease-out" });
    damage(mx - 40, my - 20, 4); damage(mx + 40, my + 40, kind === "wins" ? 2 : 4);
    await sleep(520);
    if (kind === "trade") { await Promise.all([die(atk), die(blk)]); }
    else { await Promise.all([die(blk), returnHome(atk)]); }
  }
  busy = false; document.querySelectorAll("button").forEach((b) => (b.disabled = false));
}
b1.onclick = () => { calm = false; scene("open"); };
b2.onclick = () => { calm = false; scene("trade"); };
b3.onclick = () => { calm = false; scene("wins"); };
b4.onclick = () => { calm = true; scene("trade"); };
setHp(true, 20); setHp(false, 20);
</script>
</body>
</html>
